<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0a0a0a; --panel: #111; --border: #222; --text: #eaeaea; --accent: #c0392b; --gold: #d4af37; --green: #4caf50; }
    body { font-family: 'Overpass', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 2rem; }
    
    .user-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .user-main { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .user-info { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .user-name { font-weight: 700; font-size: 1.1rem; }
    .user-role { color: var(--gold); font-weight: 600; font-size: 0.9rem; }
    
    select { padding: 0.5rem; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; cursor: pointer; outline: none; }
    
    /* Панель управления деньгами */
    .money-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; background: rgba(0,0,0,0.3); padding: 0.5rem 1rem; border-radius: 6px; }
    .money-label { color: #999; font-size: 0.9rem; margin-right: 0.5rem; }
    .money-input { padding: 0.4rem; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; width: 100px; font-family: inherit; }
    .btn-money { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-family: inherit; transition: 0.2s; }
    .btn-add { background: var(--green); color: #fff; }
    .btn-add:hover { background: #3d8b40; }
    .btn-reset { background: var(--accent); color: #fff; }
    .btn-reset:hover { background: #a93226; }
    
    .back-link { display: block; text-align: center; margin-top: 2rem; color: #666; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Управление участниками</h1>
  <div id="usersList">Загрузка...</div>
  <a href="profile.html" class="back-link">← Вернуться в личный кабинет</a>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const rolePriority = {
      'Глава': 1, 'Администратор': 2, 'Заместитель': 3, 'Кровь Семьи': 4, 'Стажер': 5, 'Боец': 6
    };

    async function init() {
      await new Promise(r => setTimeout(r, 500));
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();

      // Проверка прав: только Глава или Администратор
      if (!profile || (profile.role !== 'Глава' && profile.role !== 'Администратор')) {
        document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:#c0392b;">Доступ запрещён!</h1><p style="text-align:center;">Вы не имеете прав на это действие.</p><a href="profile.html" style="display:block; text-align:center; margin-top:1rem; color:#c0392b;">Вернуться</a>';
        return;
      }

      loadUsers();
    }

    async function loadUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      
      const { data: users, error } = await supabase.from('profiles').select('*');

      if (error) {
        list.innerHTML = '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
        return;
      }

      // Сортировка по роли
      users.sort((a, b) => (rolePriority[a.role] || 99) - (rolePriority[b.role] || 99));
      
      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        
        // Формируем карточку с полем для денег
        card.innerHTML = `
          <div class="user-main">
            <div class="user-info">
              <span class="user-name">${user.nickname}</span>
              <span class="user-role">(${user.role})</span>
              <span style="color: var(--green); font-weight: 700; margin-left: 1rem;">Баланс: ${user.balance || 0} $</span>
            </div>
            <div>
              <select onchange="changeRole('${user.id}', this.value)">
                <option value="Глава" ${user.role === 'Глава' ? 'selected' : ''}>Глава</option>
                <option value="Заместитель" ${user.role === 'Заместитель' ? 'selected' : ''}>Заместитель</option>
                <option value="Кровь Семьи" ${user.role === 'Кровь Семьи' ? 'selected' : ''}>Кровь Семьи</option>
                <option value="Стажер" ${user.role === 'Стажер' ? 'selected' : ''}>Стажер</option>
              </select>
            </div>
          </div>
          
          <div class="money-controls">
            <span class="money-label">Управление балансом:</span>
            <input type="number" id="money-${user.id}" class="money-input" placeholder="Сумма">
            <button class="btn-money btn-add" onclick="addMoney('${user.id}')">Начислить (+)</button>
            <button class="btn-money btn-reset" onclick="resetMoney('${user.id}')">Обнулить (0)</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window.changeRole = async function(userId, newRole) {
      const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else location.reload(); 
    };

    // НАЧИСЛЕНИЕ ДЕНЕГ
    window.addMoney = async function(userId) {
      const input = document.getElementById(`money-${userId}`);
      const amount = parseInt(input.value);

      if (isNaN(amount) || amount <= 0) {
        alert('Введите корректную сумму (больше 0)!');
        return;
      }

      // Получаем текущий баланс
      const { data: userData } = await supabase.from('profiles').select('balance').eq('id', userId).single();
      const currentBalance = userData.balance || 0;

      // Обновляем
      const { error } = await supabase.from('profiles').update({ balance: currentBalance + amount }).eq('id', userId);

      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        alert(`Успешно начислено ${amount} $!`);
        loadUsers(); // Обновляем список на странице
      }
    };

    // ОБНУЛЕНИЕ ДЕНЕГ
    window.resetMoney = async function(userId) {
      if (!confirm('Вы уверены, что хотите обнулить баланс этого участника?')) return;

      const { error } = await supabase.from('profiles').update({ balance: 0 }).eq('id', userId);

      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        alert('Баланс обнулен!');
        loadUsers(); // Обновляем список на странице
      }
    };

    init();
  </script>
</body>
</html>
