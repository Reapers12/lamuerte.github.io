<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления — La Muerte</title>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f4f7; --panel: rgba(255, 255, 255, 0.92); --border: #e0e0e6;
      --text: #1a1a1a; --muted: #666; --accent: #c0392b; --gold: #b8860b; --green: #2e7d32;
      --bg-image: none; --bg-overlay: rgba(255, 255, 255, 0.9);
    }
    html.dark {
      --bg: #0a0a0a; --panel: rgba(17, 17, 17, 0.95); --border: #222;
      --text: #eaeaea; --muted: #999; --gold: #d4af37; --green: #4caf50;
      --bg-image: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80');
      --bg-overlay: rgba(0, 0, 0, 0.85);
    }
    html, body { transition: background 0.4s ease, color 0.4s ease; }
    body { font-family: 'Overpass', sans-serif; background: var(--bg-image) center/cover no-repeat fixed; background-color: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; position: relative; }
    body::before { content: ""; position: fixed; inset: 0; background: var(--bg-overlay); z-index: -1; pointer-events: none; transition: background 0.4s ease; }

    header { background: var(--panel); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; transition: 0.4s; }
    header .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: 3px; color: var(--text); text-decoration: none; }
    header .logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex: 1; flex-wrap: wrap; }
    nav { display: flex; align-items: center; gap: 0.2rem; flex-wrap: wrap; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 0.35rem 0.75rem; border-radius: 6px; transition: 0.2s; }
    nav a:hover { color: var(--text); background: rgba(192, 57, 43, 0.08); }
    .logout-btn { color: var(--accent) !important; font-weight: 700 !important; margin-left: 0.5rem; border-left: 1px solid var(--border); padding-left: 1rem !important; border-radius: 0 !important; }
    .theme-btn { background: transparent; border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: 0.3s; margin-left: 0.75rem; flex-shrink: 0; }
    .theme-btn:hover { color: var(--gold); border-color: var(--gold); transform: rotate(15deg) scale(1.05); }
    .theme-btn svg { width: 16px; height: 16px; transition: transform 0.4s ease; }
    .theme-btn .icon-moon { display: none; }
    html.dark .theme-btn .icon-sun { display: none; }
    html.dark .theme-btn .icon-moon { display: block; }
    html.dark .theme-btn { color: var(--gold); border-color: var(--gold); }

    section.block { padding: 3rem 2rem; max-width: 1200px; margin: 0 auto; }
    .admin-header { margin-bottom: 2rem; text-align: center; }
    .admin-header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .admin-header p { color: var(--muted); }

    .user-list { display: flex; flex-direction: column; gap: 1.5rem; }
    
    .user-card { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: 0.2s; }
    .user-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

    .user-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
    
    .user-info-col { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .name-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    
    .name-input { padding: 0.4rem 0.6rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-weight: 700; font-size: 1.1rem; font-family: inherit; width: 200px; }
    .btn-save-name { background: var(--green); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
    
    .user-role { font-size: 0.9rem; font-weight: 700; color: var(--gold); text-transform: uppercase; }
    .user-balance { font-size: 1.1rem; font-weight: 800; color: var(--green); background: rgba(76, 175, 80, 0.1); padding: 0.25rem 0.75rem; border-radius: 6px; border: 1px solid rgba(76, 175, 80, 0.3); width: fit-content; }
    
    .role-select { padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-family: inherit; font-weight: 600; }
    .user-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; }
    .balance-input { width: 120px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-family: inherit; }
    .btn-action { border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: 0.2s; }
    .btn-add { background: var(--green); color: #fff; }
    .btn-add:hover { background: #43a047; }
    .btn-reset { background: var(--accent); color: #fff; }
    .btn-reset:hover { background: #a93226; }

    /* Встроенный блок заявок */
    .payouts-block { margin-top: 1rem; border-top: 1px dashed var(--border); padding-top: 1rem; display: none; }
    .payouts-block.active { display: block; }
    .payouts-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .btn-close-payouts { background: transparent; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    
    .payouts-table { width: 100%; border-collapse: collapse; background: var(--bg); border-radius: 6px; overflow: hidden; }
    .payouts-table th, .payouts-table td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .payouts-table th { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 0.7rem; }
    .payouts-table tr:last-child td { border-bottom: none; }
    
    .status-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: rgba(212, 175, 55, 0.15); color: var(--gold); }
    .status-approved { background: rgba(76, 175, 80, 0.15); color: var(--green); }
    .status-rejected { background: rgba(192, 57, 43, 0.15); color: var(--accent); }

    .btn-approve { background: var(--green); color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.75rem; margin-right: 0.3rem; }
    .btn-approve:hover { background: #43a047; }
    .btn-reject { background: var(--accent); color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
    .btn-reject:hover { background: #a93226; }

    footer { background: var(--panel); border-top: 1px solid var(--border); color: var(--muted); text-align: center; padding: 1.25rem; font-size: 0.85rem; margin-top: 3rem; }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">LA <span>MUERTE</span></a>
    <div class="header-right">
      <nav>
        <a href="index.html">Главная</a>
        <a href="family.html">Правила</a>
        <a href="transport.html">О транспорте</a>
        <a href="contracts.html">Контракты</a>
        <a href="tables.html">Таблицы</a>
        <a href="profile.html">Личный кабинет</a>
        <a href="#" onclick="logout()" class="logout-btn">Выйти</a>
      </nav>
      <button class="theme-btn" id="themeToggle" title="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <section class="block">
    <div class="admin-header">
      <h1>Панель управления</h1>
      <p>Управление пользователями, балансом, ролями и заявками</p>
    </div>

    <div class="user-list" id="userList">
      <p style="text-align: center; color: var(--muted);">Загрузка пользователей...</p>
    </div>
  </section>

  <footer>© 2024–2026 <span>La Muerte</span> — Все права защищены.</footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    (function () {
      const toggleBtn = document.getElementById('themeToggle');
      if (!toggleBtn) return;
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      toggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    })();

    let allUsers = [];

    async function loadUsers() {
      const { data, error } = await supabase.from('profiles').select('*').order('nickname');
      
      if (error) {
        document.getElementById('userList').innerHTML = '<p style="color: red;">Ошибка загрузки данных</p>';
        return;
      }

      allUsers = data;
      renderUsers();
    }

    function renderUsers() {
      const list = document.getElementById('userList');
      list.innerHTML = '';

      if (allUsers.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: var(--muted);">Пользователей пока нет.</p>';
        return;
      }

      allUsers.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        
        let displayName = user.nickname;
        if (displayName && displayName.includes('@')) {
          displayName = displayName.split('@')[0];
        }

        card.innerHTML = `
          <div class="user-top">
            <div class="user-info-col">
              <div class="name-row">
                <input type="text" class="name-input" id="nick-${user.id}" value="${displayName}">
                <button class="btn-save-name" onclick="saveNickname('${user.id}')">💾 Сохранить</button>
              </div>
              <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
                <span class="user-role">(${user.role})</span>
                <span class="user-balance">${(user.balance || 0).toLocaleString('ru-RU')} $</span>
                <button class="btn-action" style="background: var(--gold); color: #000;" onclick="loadPayouts('${user.discord_id || user.id}', '${displayName}')">📋 Запросы на выплаты</button>
              </div>
            </div>
            <div>
              <select class="role-select" onchange="changeRole('${user.id}', this.value)">
                <option value="Стажер" ${user.role === 'Стажер' ? 'selected' : ''}>Стажер</option>
                <option value="Боец" ${user.role === 'Боец' ? 'selected' : ''}>Боец</option>
                <option value="Заместитель" ${user.role === 'Заместитель' ? 'selected' : ''}>Заместитель</option>
                <option value="Администратор" ${user.role === 'Администратор' ? 'selected' : ''}>Администратор</option>
                <option value="Глава" ${user.role === 'Глава' ? 'selected' : ''}>Глава</option>
              </select>
            </div>
          </div>
          <div class="user-actions">
            <span style="color: var(--muted); font-size: 0.9rem;">Управление балансом:</span>
            <input type="number" class="balance-input" id="balance-${user.id}" placeholder="Сумма">
            <button class="btn-action btn-add" onclick="changeBalance('${user.id}', true)">Начислить (+)</button>
            <button class="btn-action btn-reset" onclick="changeBalance('${user.id}', false)">Обнулить (0)</button>
          </div>

          <!-- БЛОК ДЛЯ ЗАЯВОК (Скрытый по умолчанию) -->
          <div class="payouts-block" id="payouts-block-${user.id}">
            <div class="payouts-title">
              <span>📋 Заявки на выплату от ${displayName}</span>
              <button class="btn-close-payouts" onclick="closePayouts('${user.id}')">✖ Закрыть</button>
            </div>
            <div id="payouts-content-${user.id}">
              <!-- Сюда динамически вставляются таблицы -->
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // Загрузка заявок для конкретного игрока
    window.loadPayouts = async function(discordId, name) {
      const block = document.getElementById(`payouts-block-${discordId}`);
      const content = document.getElementById(`payouts-content-${discordId}`);
      
      // Если блок уже открыт, просто переключаем его
      if (block.classList.contains('active')) {
        block.classList.remove('active');
        return;
      }

      // Закрываем все остальные открытые блоки
      document.querySelectorAll('.payouts-block').forEach(el => el.classList.remove('active'));

      block.classList.add('active');
      content.innerHTML = '<p style="color: var(--muted);">Загрузка...</p>';

      const { data, error } = await supabase
        .from('payout_requests')
        .select('*')
        .eq('discord', discordId)
        .order('created_at', { ascending: false });

      if (error) {
        content.innerHTML = '<p style="color: red;">Ошибка загрузки заявок</p>';
        return;
      }

      if (!data || data.length === 0) {
        content.innerHTML = '<p style="color: var(--muted);">У этого игрока нет заявок на выплату.</p>';
        return;
      }

      // Формируем таблицу
      let html = `<table class="payouts-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Ресурс</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>`;

      data.forEach(req => {
        const date = new Date(req.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
        
        let statusClass = 'status-pending';
        let statusText = 'В ожидании';
        if (req.status === 'approved') { statusClass = 'status-approved'; statusText = 'Одобрено'; }
        if (req.status === 'rejected') { statusClass = 'status-rejected'; statusText = 'Отклонено'; }

        let actions = '';
        if (req.status === 'pending') {
          actions = `
            <button class="btn-approve" onclick="updateRequestStatus('${req.id}', 'approved', '${discordId}', '${name}')">✅</button>
            <button class="btn-reject" onclick="updateRequestStatus('${req.id}', 'rejected', '${discordId}', '${name}')">❌</button>
          `;
        } else {
          actions = '—';
        }

        html += `<tr>
          <td>${date}</td>
          <td>${req.details || req.category}</td>
          <td style="color: var(--gold); font-weight: 700;">${req.amount.toLocaleString('ru-RU')} $</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${actions}</td>
        </tr>`;
      });

      html += `</tbody></table>`;
      content.innerHTML = html;
    };

    window.closePayouts = function(id) {
      document.getElementById(`payouts-block-${id}`).classList.remove('active');
    };

    // Обновление статуса заявки (Одобрение/Отклонение)
    window.updateRequestStatus = async function(requestId, newStatus, discordId, name) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '...';

      const { error } = await supabase
        .from('payout_requests')
        .update({ status: newStatus })
        .eq('id', requestId);

      if (error) {
        alert('Ошибка: ' + error.message);
        btn.disabled = false;
        btn.textContent = newStatus === 'approved' ? '✅' : '❌';
      } else {
        // Перезагружаем блок с заявками
        window.loadPayouts(discordId, name);
        // Можно добавить логику начисления баланса, если статус 'approved'
      }
    };

    // Сохранение нового никнейма
    window.saveNickname = async function(userId) {
      const newName = document.getElementById(`nick-${userId}`).value.trim();
      if (!newName) { alert('Никнейм не может быть пустым'); return; }

      const { error } = await supabase.from('profiles').update({ nickname: newName }).eq('id', userId);
      if (error) {
        alert('Ошибка при сохранении: ' + error.message);
      } else {
        const user = allUsers.find(u => u.id === userId);
        if (user) user.nickname = newName;
        renderUsers();
      }
    };

    // Смена роли
    window.changeRole = async function(userId, newRole) {
      const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) {
        alert('Ошибка при смене роли: ' + error.message);
      } else {
        const user = allUsers.find(u => u.id === userId);
        if (user) user.role = newRole;
      }
    };

    // Изменение баланса
    window.changeBalance = async function(userId, isAdd) {
      const input = document.getElementById(`balance-${userId}`);
      let amount = parseInt(input.value) || 0;
      
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      let newBalance = user.balance || 0;

      if (isAdd) {
        if (amount <= 0) { alert('Введите сумму больше 0'); return; }
        newBalance += amount;
      } else {
        newBalance = 0;
      }

      const { error } = await supabase.from('profiles').update({ balance: newBalance }).eq('id', userId);

      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        user.balance = newBalance;
        renderUsers();
      }
    };

    window.logout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
