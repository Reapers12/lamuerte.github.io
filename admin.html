<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0a0a0a; --panel: #111; --border: #222; --text: #eaeaea; --accent: #c0392b; --gold: #d4af37; }
    body { font-family: 'Overpass', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 2rem; }
    .user-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .user-info { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .user-name { font-weight: 700; font-size: 1.1rem; }
    .user-role { color: var(--gold); font-weight: 600; }
    select { padding: 0.5rem; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; cursor: pointer; outline: none; }
    .back-link { display: block; text-align: center; margin-top: 2rem; color: #666; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Управление участниками</h1>
  <div id="usersList">Загрузка...</div>
  <a href="profile.html" class="back-link">← Вернуться в личный кабинет</a>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Иерархия ролей (для сортировки)
    const rolePriority = {
      'Глава': 1,
      'Администратор': 2, // Оставляем на случай старых записей
      'Заместитель': 3,
      'Кровь Семьи': 4,
      'Стажер': 5,
      'Боец': 6 // Оставляем на случай старых записей
    };

    async function init() {
      await new Promise(r => setTimeout(r, 500));
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();

      // Если роль не Глава и не Администратор — выкидываем
      if (!profile || (profile.role !== 'Глава' && profile.role !== 'Администратор')) {
        document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:#c0392b;">Доступ запрещён!</h1><p style="text-align:center;">Вы не Глава семьи.</p><a href="profile.html" style="display:block; text-align:center; margin-top:1rem; color:#c0392b;">Вернуться</a>';
        return;
      }

      loadUsers();
    }

    async function loadUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      
      const { data: users, error } = await supabase.from('profiles').select('*');

      if (error) {
        list.innerHTML = '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
        return;
      }

      // Сортируем пользователей по роли (согласно rolePriority)
      users.sort((a, b) => {
        const priorityA = rolePriority[a.role] || 99;
        const priorityB = rolePriority[b.role] || 99;
        return priorityA - priorityB;
      });
      
      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        
        // Формируем список опций, помечая текущую роль как selected
        card.innerHTML = `
          <div class="user-info">
            <span class="user-name">${user.nickname}</span>
            <span class="user-role">(${user.role})</span>
          </div>
          <div>
            <select onchange="changeRole('${user.id}', this.value)">
              <option value="Глава" ${user.role === 'Глава' ? 'selected' : ''}>Глава</option>
              <option value="Заместитель" ${user.role === 'Заместитель' ? 'selected' : ''}>Заместитель</option>
              <option value="Кровь Семьи" ${user.role === 'Кровь Семьи' ? 'selected' : ''}>Кровь Семьи</option>
              <option value="Стажер" ${user.role === 'Стажер' ? 'selected' : ''}>Стажер</option>
          
              <option value="Администратор" ${user.role === 'Администратор' ? 'selected' : ''} style="display:none;">Администратор (скрыто)</option>
              <option value="Боец" ${user.role === 'Боец' ? 'selected' : ''} style="display:none;">Боец (скрыто)</option>
            </select>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window.changeRole = async function(userId, newRole) {
      const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        location.reload(); 
      }
    };

    init();
  </script>
</body>
</html>
