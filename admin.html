<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — La Muerte</title>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { 
      --bg: #f4f4f7; --panel: #fff; --border: #e0e0e6; --text: #1a1a1a; 
      --accent: #c0392b; --gold: #b8860b; --green: #2e7d32; --blue: #3498db; --muted: #666;
      --bg-image: none; --bg-overlay: rgba(255, 255, 255, 0.9);
    }
    html.dark { 
      --bg: #0a0a0a; --panel: #111; --border: #222; --text: #eaeaea; 
      --gold: #d4af37; --green: #4caf50; --muted: #999;
      --bg-image: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80');
      --bg-overlay: rgba(0, 0, 0, 0.85);
    }
    html, body { transition: background 0.4s ease, color 0.4s ease; }
    body { 
      font-family: 'Overpass', sans-serif; 
      background: var(--bg-image) center/cover no-repeat fixed;
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem; 
      min-height: 100vh; 
      position: relative;
    }
    body::before { content: ""; position: fixed; inset: 0; background: var(--bg-overlay); z-index: -1; pointer-events: none; transition: background 0.4s ease; }

    h1 { color: var(--accent); text-align: center; margin-bottom: 1rem; font-weight: 800; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 2rem; flex-wrap: wrap; gap: 1rem; }
    .btn-clear { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .btn-clear:hover { background: #a93226; transform: translateY(-2px); }

    .user-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem; transition: 0.2s; }
    .user-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    
    .user-main { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .user-info { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; flex: 1; }
    
    .name-input { padding: 0.5rem 0.8rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-weight: 700; font-size: 1.1rem; font-family: inherit; width: 260px; }
    .btn-save-name { background: var(--green); color: #fff; border: none; padding: 0.5rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
    
    .user-role { color: var(--gold); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
    
    .balance-box { display: flex; align-items: center; gap: 0.5rem; background: rgba(76, 175, 80, 0.1); padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid rgba(76, 175, 80, 0.3); }
    .balance-text { color: var(--green); font-weight: 700; font-size: 1rem; }
    
    .btn-payouts { position: relative; background: var(--gold); color: #000; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .btn-payouts:hover { filter: brightness(1.1); }
    .badge { background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 800; padding: 0.1rem 0.4rem; border-radius: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(192, 57, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0); } }

    select { padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; outline: none; font-family: inherit; font-weight: 600; }
    
    .money-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; background: rgba(128, 128, 128, 0.1); padding: 0.75rem 1rem; border-radius: 6px; }
    .money-label { color: var(--muted); font-size: 0.9rem; margin-right: 0.5rem; }
    .money-input { padding: 0.4rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; width: 100px; font-family: inherit; }
    .btn-money { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-family: inherit; transition: 0.2s; }
    .btn-add { background: var(--green); color: #fff; }
    .btn-add:hover { background: #3d8b40; }
    .btn-reset { background: var(--accent); color: #fff; }
    .btn-reset:hover { background: #a93226; }
    
    .payouts-block { margin-top: 0.5rem; border-top: 1px dashed var(--border); padding-top: 1rem; display: none; }
    .payouts-block.active { display: block; }
    .payouts-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .btn-close-payouts { background: transparent; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    
    .payouts-table { width: 100%; border-collapse: collapse; background: var(--bg); border-radius: 6px; overflow: hidden; }
    .payouts-table th, .payouts-table td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .payouts-table th { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 0.7rem; }
    .payouts-table tr:last-child td { border-bottom: none; }
    
    .status-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: rgba(212, 175, 55, 0.15); color: var(--gold); }
    .status-approved { background: rgba(76, 175, 80, 0.15); color: var(--green); }
    .status-rejected { background: rgba(192, 57, 43, 0.15); color: var(--accent); }

    .btn-approve { background: var(--green); color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.75rem; margin-right: 0.3rem; }
    .btn-approve:hover { background: #43a047; }
    .btn-reject { background: var(--accent); color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
    .btn-reject:hover { background: #a93226; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
    .modal-close:hover { color: var(--accent); }
    .modal h2 { color: var(--text); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .history-list { list-style: none; }
    .history-list li { padding: 0.5rem 0; border-bottom: 1px dashed var(--border); display: flex; justify-content: space-between; font-size: 0.9rem; }
    .history-list li:last-child { border-bottom: none; }
    .history-list .h-date { color: var(--muted); font-size: 0.8rem; }
    .history-list .h-amount.add { color: var(--green); font-weight: 700; }
    .history-list .h-amount.reset { color: var(--accent); font-weight: 700; }
    
    .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }

    .theme-btn { position: fixed; bottom: 2rem; right: 2rem; background: var(--panel); border: 1px solid var(--border); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: 0.3s; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .theme-btn:hover { color: var(--gold); border-color: var(--gold); transform: rotate(15deg) scale(1.05); }
    .theme-btn svg { width: 20px; height: 20px; transition: transform 0.4s ease; }
    .theme-btn .icon-moon { display: none; }
    html.dark .theme-btn .icon-sun { display: none; }
    html.dark .theme-btn .icon-moon { display: block; }
    html.dark .theme-btn { color: var(--gold); border-color: var(--gold); }

    .main-container { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="main-container">
    <h1>Управление участниками</h1>

    <div class="top-bar">
      <div></div>
      <button class="btn-clear" onclick="clearRejectedRequests()">
        🗑️ Очистить отклоненные
      </button>
    </div>

    <div id="usersList">Загрузка...</div>
    <a href="profile.html" class="back-link">← Вернуться в личный кабинет</a>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal">
      <button class="modal-close" onclick="closeHistory()">×</button>
      <h2 id="historyTitle">История</h2>
      <ul class="history-list" id="historyList">
        <li>Загрузка...</li>
      </ul>
    </div>
  </div>

  <button class="theme-btn" id="themeToggle" title="Переключить тему">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ВАШИ ВЕБХУКИ
    const WEBHOOK_APPROVED = 'https://discord.com/api/webhooks/1563663528131428535/bKmM1iMBGXyK-0s-ilngZ7f-ZwDa5j4AhivQS56TlLHLgj3dxJZEZ0wx5YAJMcCbh4Zi';
    const WEBHOOK_REJECTED = 'https://discord.com/api/webhooks/1563663528131428535/bKmM1iMBGXyK-0s-ilngZ7f-ZwDa5j4AhivQS56TlLHLgj3dxJZEZ0wx5YAJMcCbh4Zi';

    const rolePriority = { 'Администратор': 0, 'Глава': 1, 'Заместитель': 2, 'Кровь Семьи': 3, 'Стажер': 4, 'Боец': 5 };

    let currentAdmin = null;
    let currentRole = '';
    let isSuperAdmin = false;
    let allPayouts = []; 

    (function () {
      const toggleBtn = document.getElementById('themeToggle');
      if (!toggleBtn) return;
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      toggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    })();

    async function sendDiscordLog(webhookUrl, nickname, amount, statusText, color, discordId) {
      if (!webhookUrl || webhookUrl.includes('ССЫЛКА')) return;
      
      const pingText = discordId ? `<@${discordId}>` : nickname;
      const actionText = statusText === '✅ Выплата одобрена' ? 'одобрена' : 'отклонена';
      
      const payload = {
        username: "La Muerte | Выплаты", 
        avatar_url: "https://cdn-icons-png.flaticon.com/512/2621/2621040.png",
        content: `${pingText}, ваша заявка на ${amount} $ была ${actionText}!`,
        allowed_mentions: { parse: ["users"] }, 
        embeds: [{ 
          title: statusText, 
          color: color, 
          description: `**Игрок:** ${nickname}\n**Сумма:** ${amount} $`, 
          footer: { text: `Обработал: ${currentAdmin.email}` }, 
          timestamp: new Date().toISOString() 
        }]
      };
      
      try { await fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); } catch (e) {}
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentAdmin = session.user;

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentAdmin.id).single();

      if (profile) {
        currentRole = profile.role;
        if (currentRole === 'Администратор') isSuperAdmin = true;
      }

      if (!profile || !['Глава', 'Администратор', 'Заместитель'].includes(currentRole)) {
        document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:#c0392b;">Доступ запрещён!</h1><p style="text-align:center;">Вы не имеете прав на это действие.</p><a href="profile.html" style="display:block; text-align:center; margin-top:1rem; color:#c0392b;">Вернуться</a>';
        return;
      }

      loadUsers();
    }

    window.clearRejectedRequests = async function() {
      if (!confirm('Вы уверены, что хотите безвозвратно удалить ВСЕ отклонённые заявки?')) return;

      const { error } = await supabase
        .from('payout_requests')
        .delete()
        .eq('status', 'rejected');

      if (error) {
        alert('Ошибка при очистке: ' + error.message);
      } else {
        alert('Все отклонённые заявки успешно удалены!');
        window.location.reload();
      }
    };

    async function loadUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      
      const { data: users, error } = await supabase.from('profiles').select('*');

      if (error) {
        list.innerHTML = '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
        return;
      }

      const { data: payouts } = await supabase.from('payout_requests').select('*');
      if (payouts) allPayouts = payouts;

      users.sort((a, b) => (rolePriority[a.role] ?? 99) - (rolePriority[b.role] ?? 99));
      
      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        
        let displayName = user.nickname;
        if (displayName && displayName.includes('@')) displayName = displayName.split('@')[0];

        const cleanUserName = displayName.trim().toLowerCase();
        const userPayouts = allPayouts.filter(p => p.nickname && p.nickname.trim().toLowerCase() === cleanUserName);
        
        const pendingCount = userPayouts.filter(p => p.status === 'pending').length;
        let badgeHtml = pendingCount > 0 ? `<span class="badge">${pendingCount}</span>` : '';

        let roleHtml = '';
        if (['Глава', 'Администратор'].includes(currentRole)) {
          let roleOptions = '';
          if (isSuperAdmin) {
            roleOptions += `<option value="Администратор" ${user.role === 'Администратор' ? 'selected' : ''}>⭐ Администратор</option>`;
          }
          roleOptions += `
            <option value="Глава" ${user.role === 'Глава' ? 'selected' : ''}>Глава</option>
            <option value="Заместитель" ${user.role === 'Заместитель' ? 'selected' : ''}>Заместитель</option>
            <option value="Кровь Семьи" ${user.role === 'Кровь Семьи' ? 'selected' : ''}>Кровь Семьи</option>
            <option value="Стажер" ${user.role === 'Стажер' ? 'selected' : ''}>Стажер</option>
            <option value="Боец" ${user.role === 'Боец' ? 'selected' : ''}>Боец</option>
          `;
          roleHtml = `<select onchange="changeRole('${user.id}', this.value)">${roleOptions}</select>`;
        } else {
          roleHtml = `<span style="color: var(--muted); font-size: 0.9rem;">Роль: ${user.role}</span>`;
        }

        card.innerHTML = `
          <div class="user-main">
            <div class="user-info">
              <input type="text" class="name-input" id="nick-${user.id}" value="${displayName}">
              <button class="btn-save-name" onclick="saveNickname('${user.id}')">💾 Сохранить</button>
              
              <span class="user-role">(${user.role})</span>
              
              <div class="balance-box">
                <span class="balance-text">${user.balance || 0} $</span>
                <button class="btn-history" onclick="openHistory('${user.id}', '${displayName}')" style="background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:0.8rem;">История</button>
              </div>

              <button class="btn-payouts" onclick="togglePayouts('${user.id}', '${displayName}')">
                📋 Заявки ${badgeHtml}
              </button>
            </div>
            <div>${roleHtml}</div>
          </div>
          <div class="money-controls">
            <span class="money-label">Управление балансом:</span>
            <input type="number" id="money-${user.id}" class="money-input" placeholder="Сумма">
            <button class="btn-money btn-add" onclick="addMoney('${user.id}', '${displayName}')">Начислить (+)</button>
            <button class="btn-money btn-reset" onclick="resetMoney('${user.id}', '${displayName}')">Обнулить (0)</button>
          </div>

          <div class="payouts-block" id="payouts-block-${user.id}">
            <div class="payouts-title">
              <span>📋 История выплат от ${displayName}</span>
              <button class="btn-close-payouts" onclick="closePayouts('${user.id}')">✖ Закрыть</button>
            </div>
            <div id="payouts-content-${user.id}"></div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window.saveNickname = async function(userId) {
      const newName = document.getElementById(`nick-${userId}`).value.trim();
      if (!newName) { alert('Никнейм не может быть пустым'); return; }

      const { error } = await supabase.from('profiles').update({ nickname: newName }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else loadUsers();
    };

    window.changeRole = async function(userId, newRole) {
      if (!['Глава', 'Администратор'].includes(currentRole)) { alert('У вас нет прав на изменение ролей!'); return; }
      const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else location.reload(); 
    };

    window.addMoney = async function(userId, nickname) {
      const input = document.getElementById(`money-${userId}`);
      const amount = parseInt(input.value);

      if (isNaN(amount) || amount <= 0) { alert('Введите корректную сумму!'); return; }

      const { data: userData } = await supabase.from('profiles').select('balance').eq('id', userId).single();
      const currentBalance = userData.balance || 0;

      const { error } = await supabase.from('profiles').update({ balance: currentBalance + amount }).eq('id', userId);

      if (error) { alert('Ошибка: ' + error.message); } 
      else {
        await supabase.from('transactions').insert([{ admin_id: currentAdmin.id, user_id: userId, amount: amount, type: 'add' }]);
        alert(`Успешно начислено ${amount} $ для ${nickname}!`);
        loadUsers();
      }
    };

    window.resetMoney = async function(userId, nickname) {
      if (!confirm(`Обнулить баланс ${nickname}?`)) return;
      const { error } = await supabase.from('profiles').update({ balance: 0 }).eq('id', userId);
      if (error) { alert('Ошибка: ' + error.message); } 
      else {
        await supabase.from('transactions').insert([{ admin_id: currentAdmin.id, user_id: userId, amount: 0, type: 'reset' }]);
        alert(`Баланс ${nickname} обнулен!`);
        loadUsers();
      }
    };

    window.togglePayouts = function(userId, name) {
      const block = document.getElementById(`payouts-block-${userId}`);
      const content = document.getElementById(`payouts-content-${userId}`);
      
      if (block.classList.contains('active')) {
        block.classList.remove('active');
        return;
      }

      document.querySelectorAll('.payouts-block').forEach(el => el.classList.remove('active'));
      block.classList.add('active');

      const cleanName = name.trim().toLowerCase();
      const userPayouts = allPayouts.filter(p => p.nickname && p.nickname.trim().toLowerCase() === cleanName);

      if (userPayouts.length === 0) {
        content.innerHTML = '<p style="color: var(--muted);">Нет заявок.</p>';
        return;
      }

      let html = `<table class="payouts-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Ресурс</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>`;

      userPayouts.forEach(req => {
        const date = new Date(req.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
        let statusClass = 'status-pending';
        let statusText = 'В ожидании';
        if (req.status === 'approved') { statusClass = 'status-approved'; statusText = 'Одобрено'; }
        if (req.status === 'rejected') { statusClass = 'status-rejected'; statusText = 'Отклонено'; }

        let actions = '';
        if (req.status === 'pending') {
          actions = `
            <button class="btn-approve" onclick="updateRequestStatus('${req.id}', 'approved', '${req.nickname}', ${req.amount})">✅</button>
            <button class="btn-reject" onclick="updateRequestStatus('${req.id}', 'rejected', '${req.nickname}', ${req.amount})">❌</button>
          `;
        } else {
          actions = '—';
        }

        html += `<tr>
          <td>${date}</td>
          <td>${req.details || req.category}</td>
          <td style="color: var(--gold); font-weight: 700;">${req.amount.toLocaleString('ru-RU')} $</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${actions}</td>
        </tr>`;
      });

      html += `</tbody></table>`;
      content.innerHTML = html;
    };

    window.closePayouts = function(userId) {
      document.getElementById(`payouts-block-${userId}`).classList.remove('active');
    };

    window.updateRequestStatus = async function(reqId, newStatus, nickname, amount) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '...';

      const reqData = allPayouts.find(p => p.id === reqId);
      const discordId = reqData ? reqData.discord : null;

      if (newStatus === 'approved') {
        let { data: users, error: userError } = await supabase.from('profiles').select('id, nickname, balance, contracts');
        
        let hasContracts = true;

        if (userError) {
          hasContracts = false;
          const { data: fallbackUsers, error: fallbackError } = await supabase.from('profiles').select('id, nickname, balance');
          if (fallbackError) { alert('Ошибка базы: ' + fallbackError.message); btn.disabled = false; btn.textContent = '✅'; return; }
          users = fallbackUsers;
        }

        const cleanName = nickname.trim().toLowerCase();
        const userData = users.find(u => u.nickname && u.nickname.trim().toLowerCase() === cleanName);

        if (!userData) {
          alert(`Ошибка: Игрок с ником "${nickname}" не найден в профилях.`);
          btn.disabled = false;
          btn.textContent = '✅';
          return;
        }

        const currentBalance = Number(userData.balance) || 0;
        const newBalance = currentBalance + amount;

        if (hasContracts) {
          const currentContracts = Number(userData.contracts) || 0;
          const newContracts = currentContracts + 1;
          
          await supabase.from('profiles').update({ 
            balance: newBalance, 
            contracts: newContracts 
          }).eq('id', userData.id);
        } else {
          await supabase.from('profiles').update({ balance: newBalance }).eq('id', userData.id);
        }

        await supabase.from('transactions').insert([{ admin_id: currentAdmin.id, user_id: userData.id, amount: amount, type: 'add' }]);
        await sendDiscordLog(WEBHOOK_APPROVED, nickname, amount, '✅ Выплата одобрена', 0x4caf50, discordId);
      } else {
        await sendDiscordLog(WEBHOOK_REJECTED, nickname, amount, '❌ Выплата отклонена', 0xe74c3c, discordId);
      }

      const { error } = await supabase
        .from('payout_requests')
        .update({ status: newStatus })
        .eq('id', reqId);

      if (error) {
        alert('Ошибка смены статуса: ' + error.message);
        btn.disabled = false;
        btn.textContent = newStatus === 'approved' ? '✅' : '❌';
      } else {
        // ВМЕСТО ПОЛНОЙ ПЕРЕЗАГРУЗКИ — ОБНОВЛЯЕМ ТОЛЬКО ТЕКУЩУЮ ТАБЛИЦУ
        // Находим блок, к которому относится эта кнопка
        const userCard = btn.closest('.user-card');
        const payoutsBlock = userCard.querySelector('.payouts-block');
        const content = payoutsBlock.querySelector('[id^="payouts-content-"]');
        
        // Получаем имя игрока из заголовка карточки
        const name = userCard.querySelector('.name-input').value.trim().toLowerCase();
        
        // Перерисовываем ТОЛЬКО таблицу этого игрока, не трогая остальные
        const userPayouts = allPayouts.filter(p => p.nickname && p.nickname.trim().toLowerCase() === name);
        
        // Обновляем локальный массив
        const idx = allPayouts.findIndex(p => p.id === reqId);
        if (idx !== -1) allPayouts[idx].status = newStatus;

        let html = `<table class="payouts-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Ресурс</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>`;

        userPayouts.forEach(req => {
          const date = new Date(req.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
          let statusClass = 'status-pending';
          let statusText = 'В ожидании';
          if (req.status === 'approved') { statusClass = 'status-approved'; statusText = 'Одобрено'; }
          if (req.status === 'rejected') { statusClass = 'status-rejected'; statusText = 'Отклонено'; }

          let actions = '';
          if (req.status === 'pending') {
            actions = `
              <button class="btn-approve" onclick="updateRequestStatus('${req.id}', 'approved', '${req.nickname}', ${req.amount})">✅</button>
              <button class="btn-reject" onclick="updateRequestStatus('${req.id}', 'rejected', '${req.nickname}', ${req.amount})">❌</button>
            `;
          } else {
            actions = '—';
          }

          html += `<tr>
            <td>${date}</td>
            <td>${req.details || req.category}</td>
            <td style="color: var(--gold); font-weight: 700;">${req.amount.toLocaleString('ru-RU')} $</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${actions}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        content.innerHTML = html;

        // Обновляем бейдж непрочитанных (если он есть)
        const pendingCount = userPayouts.filter(p => p.status === 'pending').length;
        const badgeSpan = userCard.querySelector('.btn-payouts .badge');
        
        if (pendingCount > 0) {
          if (badgeSpan) badgeSpan.textContent = pendingCount;
          else {
            const btnPayouts = userCard.querySelector('.btn-payouts');
            btnPayouts.insertAdjacentHTML('beforeend', ` <span class="badge">${pendingCount}</span>`);
          }
        } else {
          if (badgeSpan) badgeSpan.remove();
        }
      }
    };

    window.openHistory = async function(userId, nickname) {
      document.getElementById('historyTitle').textContent = `История: ${nickname}`;
      const list = document.getElementById('historyList');
      list.innerHTML = '<li>Загрузка...</li>';
      document.getElementById('historyModal').classList.add('active');

      const { data, error } = await supabase.from('transactions').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(15);

      if (error) { list.innerHTML = `<li style="color:red;">Ошибка: ${error.message}</li>`; return; }
      if (data.length === 0) { list.innerHTML = '<li style="color:#666;">Пока нет операций</li>'; return; }

      list.innerHTML = '';
      data.forEach(t => {
        const date = new Date(t.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        let text = t.type === 'add' ? `+${t.amount} $` : `Обнуление`;
        list.innerHTML += `<li><span class="h-date">${date}</span><span class="h-amount ${t.type}">${text}</span></li>`;
      });
    };

    window.closeHistory = function() { document.getElementById('historyModal').classList.remove('active'); };

    init();
  </script>
</body>
</html>
