<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0a0a0a; --panel: #111; --border: #222; --text: #eaeaea; --accent: #c0392b; --gold: #d4af37; --green: #4caf50; --blue: #3498db; }
    body { font-family: 'Overpass', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 2rem; }
    
    /* ===== БЛОК ЗАЯВОК ===== */
    .requests-section { background: rgba(192, 57, 43, 0.1); border: 1px solid var(--accent); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; display: none; }
    .requests-section.active { display: block; }
    .requests-title { color: var(--accent); font-size: 1.2rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .req-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .req-info { flex: 1; min-width: 250px; }
    .req-info strong { color: #fff; font-size: 1.1rem; }
    .req-info .req-amount { color: var(--gold); font-weight: 800; font-size: 1.1rem; }
    .req-info p { color: #999; font-size: 0.9rem; margin-top: 0.2rem; }
    .req-info a { color: var(--blue); text-decoration: none; }
    .req-info a:hover { text-decoration: underline; }
    
    .req-actions { display: flex; gap: 0.5rem; }
    .btn-approve { background: var(--green); color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-approve:hover { background: #3d8b40; }
    .btn-reject { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 0.6rem 1rem; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-reject:hover { background: rgba(192, 57, 43, 0.2); }

    /* ===== КАРТОЧКИ ЮЗЕРОВ ===== */
    .user-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .user-main { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .user-info { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .user-name { font-weight: 700; font-size: 1.1rem; }
    .user-role { color: var(--gold); font-weight: 600; font-size: 0.9rem; }
    
    .balance-box { display: flex; align-items: center; gap: 0.5rem; background: rgba(76, 175, 80, 0.1); padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid rgba(76, 175, 80, 0.3); }
    .balance-text { color: var(--green); font-weight: 700; font-size: 1rem; }
    .btn-history { background: transparent; border: 1px solid var(--border); color: #999; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .btn-history:hover { color: var(--accent); border-color: var(--accent); }
    
    select { padding: 0.5rem; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; cursor: pointer; outline: none; }
    
    .money-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; background: rgba(0,0,0,0.3); padding: 0.5rem 1rem; border-radius: 6px; }
    .money-label { color: #999; font-size: 0.9rem; margin-right: 0.5rem; }
    .money-input { padding: 0.4rem; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; width: 100px; font-family: inherit; }
    .btn-money { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-family: inherit; transition: 0.2s; }
    .btn-add { background: var(--green); color: #fff; }
    .btn-add:hover { background: #3d8b40; }
    .btn-reset { background: var(--accent); color: #fff; }
    .btn-reset:hover { background: #a93226; }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: #999; font-size: 1.5rem; cursor: pointer; }
    .modal-close:hover { color: var(--accent); }
    .modal h2 { color: #fff; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .history-list { list-style: none; }
    .history-list li { padding: 0.5rem 0; border-bottom: 1px dashed #333; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .history-list li:last-child { border-bottom: none; }
    .history-list .h-date { color: #999; font-size: 0.8rem; }
    .history-list .h-amount.add { color: var(--green); font-weight: 700; }
    .history-list .h-amount.reset { color: var(--accent); font-weight: 700; }
    
    .back-link { display: block; text-align: center; margin-top: 2rem; color: #666; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Управление участниками</h1>

  <div class="requests-section" id="requestsSection">
    <div class="requests-title">⏳ Ожидают выплаты</div>
    <div id="requestsList"></div>
  </div>

  <div id="usersList">Загрузка...</div>
  <a href="profile.html" class="back-link">← Вернуться в личный кабинет</a>

  <div class="modal-overlay" id="historyModal">
    <div class="modal">
      <button class="modal-close" onclick="closeHistory()">×</button>
      <h2 id="historyTitle">История</h2>
      <ul class="history-list" id="historyList">
        <li>Загрузка...</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== ССЫЛКИ НА ВЕБХУКИ DISCORD =====
    // Вставь сюда ссылку на канал, куда будут падать логи об одобрении
    const WEBHOOK_APPROVED = 'ССЫЛКА_НА_ВЕБХУК_ОДОБРЕНИЯ'; 
    // Вставь сюда ссылку на канал, куда будут падать логи об отказе
    const WEBHOOK_REJECTED = 'ССЫЛКА_НА_ВЕБХУК_ОТКАЗА'; 

    const rolePriority = { 'Администратор': 1, 'Глава': 2, 'Заместитель': 3, 'Кровь Семьи': 4, 'Стажер': 5, 'Боец': 6 };

    let currentAdmin = null;
    let currentRole = '';
    let isSuperAdmin = false;

    // Функция отправки сообщения в Discord
    async function sendDiscordLog(webhookUrl, nickname, amount, statusText, color) {
      if (webhookUrl === 'ССЫЛКА_НА_ВЕБХУК_ОДОБРЕНИЯ' || !webhookUrl) return; // Пропускаем, если ссылка не вставлена

      const payload = {
        username: "La Muerte | Логи",
        avatar_url: "https://cdn-icons-png.flaticon.com/512/2621/2621040.png",
        embeds: [{
          title: statusText,
          color: color,
          description: `**Игрок:** ${nickname}\n**Сумма:** ${amount} $`,
          footer: { text: `Обработал: ${currentAdmin.email}` },
          timestamp: new Date().toISOString()
        }]
      };

      try {
        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Ошибка отправки в Discord:', e);
      }
    }

    async function init() {
      await new Promise(r => setTimeout(r, 500));
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) { window.location.href = 'login.html'; return; }
      currentAdmin = session.user;

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentAdmin.id).single();

      if (profile) {
        currentRole = profile.role;
        if (currentRole === 'Администратор') isSuperAdmin = true;
      }

      if (!profile || !['Глава', 'Администратор', 'Заместитель'].includes(currentRole)) {
        document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:#c0392b;">Доступ запрещён!</h1><p style="text-align:center;">Вы не имеете прав на это действие.</p><a href="profile.html" style="display:block; text-align:center; margin-top:1rem; color:#c0392b;">Вернуться</a>';
        return;
      }

      loadRequests();
      loadUsers();
    }

    // ===== ЗАГРУЗКА ЗАЯВОК =====
    async function loadRequests() {
      const section = document.getElementById('requestsSection');
      const list = document.getElementById('requestsList');
      
      const { data, error } = await supabase.from('payout_requests').select('*').eq('status', 'pending').order('created_at', { ascending: true });

      if (error || !data || data.length === 0) {
        section.classList.remove('active');
        return;
      }

      section.classList.add('active');
      list.innerHTML = '';

      data.forEach(req => {
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <div class="req-info">
            <strong>${req.nickname}</strong> запрашивает <span class="req-amount">${req.amount} $</span>
            <p>${req.category} | ${req.details}</p>
            <p><a href="${req.screenshot}" target="_blank">📸 Смотреть скриншот</a> | Discord: ${req.discord}</p>
          </div>
          <div class="req-actions">
            <button class="btn-approve" onclick="approveRequest('${req.id}', '${req.nickname}', ${req.amount})">✅ Выплатить</button>
            <button class="btn-reject" onclick="rejectRequest('${req.id}', '${req.nickname}', ${req.amount})">❌ Отклонить</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // ОДОБРЕНИЕ
    window.approveRequest = async function(reqId, nickname, amount) {
      if (!confirm(`Вы уверены, что хотите выплатить ${amount} $ игроку ${nickname}?`)) return;

      const { data: userData, error: userError } = await supabase.from('profiles').select('id, balance').eq('nickname', nickname).single();

      if (userError || !userData) {
        alert('Ошибка: Игрок с таким ником не найден в базе!');
        return;
      }

      const newBalance = (userData.balance || 0) + amount;

      const { error: updateError } = await supabase.from('profiles').update({ balance: newBalance }).eq('id', userData.id);
      
      if (updateError) {
        alert('Ошибка при начислении: ' + updateError.message);
        return;
      }

      await supabase.from('transactions').insert([{
        admin_id: currentAdmin.id, user_id: userData.id, amount: amount, type: 'add'
      }]);

      await supabase.from('payout_requests').update({ status: 'approved' }).eq('id', reqId);

      // ОТПРАВЛЯЕМ ЛОГ В DISCORD
      await sendDiscordLog(WEBHOOK_APPROVED, nickname, amount, '✅ Выплата одобрена', 0x4caf50);

      alert(`Успешно выплачено ${amount} $ для ${nickname}!`);
      loadRequests();
      loadUsers();
    };

    // ОТКЛОНЕНИЕ
    window.rejectRequest = async function(reqId, nickname, amount) {
      if (!confirm('Отклонить эту заявку?')) return;
      
      await supabase.from('payout_requests').update({ status: 'rejected' }).eq('id', reqId);
      
      // ОТПРАВЛЯЕМ ЛОГ В DISCORD
      await sendDiscordLog(WEBHOOK_REJECTED, nickname, amount, '❌ Выплата отклонена', 0xe74c3c);
      
      loadRequests();
    };

    // ===== ЗАГРУЗКА ЮЗЕРОВ =====
    async function loadUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      
      const { data: users, error } = await supabase.from('profiles').select('*');

      if (error) {
        list.innerHTML = '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
        return;
      }

      users.sort((a, b) => (rolePriority[a.role] || 99) - (rolePriority[b.role] || 99));
      
      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        
        let roleHtml = '';
        if (['Глава', 'Администратор'].includes(currentRole)) {
          let roleOptions = `
            <option value="Глава" ${user.role === 'Глава' ? 'selected' : ''}>Глава</option>
            <option value="Заместитель" ${user.role === 'Заместитель' ? 'selected' : ''}>Заместитель</option>
            <option value="Кровь Семьи" ${user.role === 'Кровь Семьи' ? 'selected' : ''}>Кровь Семьи</option>
            <option value="Стажер" ${user.role === 'Стажер' ? 'selected' : ''}>Стажер</option>
          `;
          if (isSuperAdmin) {
            roleOptions += `<option value="Администратор" ${user.role === 'Администратор' ? 'selected' : ''}>⭐ Администратор</option>`;
          }
          roleHtml = `<select onchange="changeRole('${user.id}', this.value)">${roleOptions}</select>`;
        } else {
          roleHtml = `<span style="color: var(--muted); font-size: 0.9rem;">Роль: ${user.role}</span>`;
        }

        card.innerHTML = `
          <div class="user-main">
            <div class="user-info">
              <span class="user-name">${user.nickname}</span>
              <span class="user-role">(${user.role})</span>
              <div class="balance-box">
                <span class="balance-text">${user.balance || 0} $</span>
                <button class="btn-history" onclick="openHistory('${user.id}', '${user.nickname}')">История</button>
              </div>
            </div>
            <div>${roleHtml}</div>
          </div>
          <div class="money-controls">
            <span class="money-label">Управление балансом:</span>
            <input type="number" id="money-${user.id}" class="money-input" placeholder="Сумма">
            <button class="btn-money btn-add" onclick="addMoney('${user.id}', '${user.nickname}')">Начислить (+)</button>
            <button class="btn-money btn-reset" onclick="resetMoney('${user.id}', '${user.nickname}')">Обнулить (0)</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window.changeRole = async function(userId, newRole) {
      if (!['Глава', 'Администратор'].includes(currentRole)) { alert('У вас нет прав на изменение ролей!'); return; }
      const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else location.reload(); 
    };

    window.addMoney = async function(userId, nickname) {
      const input = document.getElementById(`money-${userId}`);
      const amount = parseInt(input.value);

      if (isNaN(amount) || amount <= 0) { alert('Введите корректную сумму!'); return; }

      const { data: userData } = await supabase.from('profiles').select('balance').eq('id', userId).single();
      const currentBalance = userData.balance || 0;

      const { error } = await supabase.from('profiles').update({ balance: currentBalance + amount }).eq('id', userId);

      if (error) { alert('Ошибка: ' + error.message); } 
      else {
        await supabase.from('transactions').insert([{ admin_id: currentAdmin.id, user_id: userId, amount: amount, type: 'add' }]);
        alert(`Успешно начислено ${amount} $ для ${nickname}!`);
        loadUsers();
      }
    };

    window.resetMoney = async function(userId, nickname) {
      if (!confirm(`Обнулить баланс ${nickname}?`)) return;
      const { error } = await supabase.from('profiles').update({ balance: 0 }).eq('id', userId);
      if (error) { alert('Ошибка: ' + error.message); } 
      else {
        await supabase.from('transactions').insert([{ admin_id: currentAdmin.id, user_id: userId, amount: 0, type: 'reset' }]);
        alert(`Баланс ${nickname} обнулен!`);
        loadUsers();
      }
    };

    window.openHistory = async function(userId, nickname) {
      document.getElementById('historyTitle').textContent = `История: ${nickname}`;
      const list = document.getElementById('historyList');
      list.innerHTML = '<li>Загрузка...</li>';
      document.getElementById('historyModal').classList.add('active');

      const { data, error } = await supabase.from('transactions').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(15);

      if (error) { list.innerHTML = `<li style="color:red;">Ошибка: ${error.message}</li>`; return; }
      if (data.length === 0) { list.innerHTML = '<li style="color:#666;">Пока нет операций</li>'; return; }

      list.innerHTML = '';
      data.forEach(t => {
        const date = new Date(t.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        let text = t.type === 'add' ? `+${t.amount} $` : `Обнуление`;
        list.innerHTML += `<li><span class="h-date">${date}</span><span class="h-amount ${t.type}">${text}</span></li>`;
      });
    };

    window.closeHistory = function() { document.getElementById('historyModal').classList.remove('active'); };

    init();
  </script>
</body>
</html>
