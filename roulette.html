<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рулетка — La Muerte</title>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f4f7; --panel: rgba(255, 255, 255, 0.92); --border: #e0e0e6;
      --text: #1a1a1a; --muted: #666; --accent: #c0392b; --gold: #b8860b; --green: #2e7d32;
      --bg-image: none; --bg-overlay: rgba(255, 255, 255, 0.9);
    }
    html.dark {
      --bg: #0a0a0a; --panel: rgba(17, 17, 17, 0.95); --border: #222;
      --text: #eaeaea; --muted: #999; --gold: #d4af37; --green: #4caf50;
      --bg-image: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80');
      --bg-overlay: rgba(0, 0, 0, 0.85);
    }
    html, body { transition: background 0.4s ease, color 0.4s ease; }
    body {
      font-family: 'Overpass', sans-serif; background: var(--bg-image) center/cover no-repeat fixed;
      background-color: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; position: relative;
    }
    body::before { content: ""; position: fixed; inset: 0; background: var(--bg-overlay); z-index: -1; pointer-events: none; transition: background 0.4s ease; }

    /* ===== Шапка ===== */
    header { background: var(--panel); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 1rem; transition: 0.4s; }
    header .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: 3px; color: var(--text); text-decoration: none; }
    header .logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex: 1; flex-wrap: wrap; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem; }
    nav a { position: relative; color: var(--muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 0.35rem 0.75rem; border-radius: 6px; overflow: hidden; white-space: nowrap; transition: 0.2s; }
    nav a:hover { color: var(--text); background: rgba(192, 57, 43, 0.08); box-shadow: 0 0 0 1px rgba(192, 57, 43, 0.35), 0 0 16px rgba(192, 57, 43, 0.35); }
    nav a.active { color: var(--text); background: rgba(192, 57, 43, 0.14); }
    .profile-btn { color: var(--gold) !important; font-weight: 700 !important; margin-left: 0.5rem; border-left: 1px solid var(--border); padding-left: 1rem !important; border-radius: 0 !important; }
    .profile-btn:hover { background: transparent !important; box-shadow: none !important; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

    /* Молнии */
    nav a .lightning { position: absolute; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, transparent, var(--accent), #fff, var(--accent), transparent); filter: blur(0.4px) drop-shadow(0 0 6px rgba(192, 57, 43, 0.9)); opacity: 0; pointer-events: none; z-index: 1; }
    nav a .lightning::before { content: ""; position: absolute; inset: 0; background: inherit; transform: skewX(-15deg); }
    nav a .lightning.left { left: 0; transform: translateY(-100%) scaleY(0.6); }
    nav a .lightning.right { right: 0; transform: translateY(100%) scaleY(0.6); }
    nav a .spark { position: absolute; top: 50%; left: 0; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 2px rgba(255, 230, 100, 0.9), 0 0 10px 3px rgba(192, 57, 43, 0.7); opacity: 0; pointer-events: none; transform: translateY(-50%); z-index: 1; }
    nav a:hover .lightning.left { animation: lightningSlideDown 0.7s ease-out; }
    nav a:hover .lightning.right { animation: lightningSlideUp 0.7s ease-out; }
    nav a:hover .spark { animation: sparkFly 0.9s ease-out; }
    nav a:hover .spark.s2 { animation-delay: 0.12s; }
    nav a:hover .spark.s3 { animation-delay: 0.24s; }

    /* Кнопка темы */
    .theme-btn { background: transparent; border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: 0.3s; margin-left: 0.75rem; flex-shrink: 0; }
    .theme-btn:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); transform: rotate(15deg) scale(1.05); }
    .theme-btn svg { width: 16px; height: 16px; transition: transform 0.4s ease; }
    .theme-btn .icon-moon { display: none; }
    html.dark .theme-btn .icon-sun { display: none; }
    html.dark .theme-btn .icon-moon { display: block; }
    html.dark .theme-btn { color: var(--gold); border-color: var(--gold); }

    @keyframes lightningSlideDown { 0% { opacity: 0; transform: translateY(-100%) scaleY(0.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(100%) scaleY(1); } }
    @keyframes lightningSlideUp { 0% { opacity: 0; transform: translateY(100%) scaleY(0.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-100%) scaleY(1); } }
    @keyframes sparkFly { 0% { opacity: 0; left: 10%; transform: translateY(-50%) scale(0.4); } 25% { opacity: 1; } 100% { opacity: 0; left: 90%; transform: translateY(-50%) scale(1.2); } }

    /* ===== Контент Рулетки ===== */
    .page-hero { padding: 4rem 2rem 1rem; text-align: center; position: relative; }
    .page-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(192, 57, 43, 0.3), transparent 60%); pointer-events: none; }
    .page-hero h1 { font-size: clamp(1.75rem, 4.5vw, 2.5rem); font-weight: 800; color: var(--text); margin-bottom: 0.75rem; position: relative; }
    .page-hero h1 em { color: var(--accent); font-style: normal; }
    .page-hero p { color: var(--muted); font-size: 0.95rem; max-width: 640px; margin: 0 auto; position: relative; }

    .roulette-container { max-width: 800px; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 3rem; }
    
    .wheel-wrapper { position: relative; width: 300px; height: 300px; border-radius: 50%; border: 8px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1); transform: rotate(0deg); }
    
    .wheel {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(
        #c0392b 0deg 45deg, 
        #2e7d32 45deg 90deg, 
        #3498db 90deg 135deg, 
        #8e44ad 135deg 180deg, 
        #d35400 180deg 225deg, 
        #c0392b 225deg 270deg, 
        #2e7d32 270deg 315deg, 
        #3498db 315deg 360deg
      );
      position: relative;
      overflow: hidden;
    }

    .wheel::after { content: ""; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="0" x2="50" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="2"/><line x1="0" y1="50" x2="100" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="2"/></svg>'); background-size: 100% 100%; transform: rotate(22.5deg); pointer-events: none; }

    .wheel-pointer { position: absolute; top: -15px; z-index: 5; font-size: 2.5rem; color: var(--gold); text-shadow: 0 2px 5px rgba(0,0,0,0.5); transform: rotate(180deg); }
    
    .wheel-center { position: absolute; width: 50px; height: 50px; background: var(--panel); border: 4px solid var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 800; color: var(--gold); z-index: 10; cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: transform 0.2s; }
    .wheel-center:hover { transform: scale(1.1); }
    .wheel-center:active { transform: scale(0.95); }
    .wheel-center.spinning { pointer-events: none; opacity: 0.7; }

    .spin-btn { padding: 1rem 3rem; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(192, 57, 43, 0.4); text-transform: uppercase; letter-spacing: 2px; }
    .spin-btn:hover { transform: translateY(-2px); background: #e74c3c; box-shadow: 0 6px 20px rgba(192, 57, 43, 0.6); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .prize-result { font-size: 1.5rem; font-weight: 800; color: var(--gold); text-align: center; min-height: 2rem; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); opacity: 0; transition: opacity 0.5s; }
    .prize-result.show { opacity: 1; }

    footer { background: var(--panel); backdrop-filter: blur(6px); border-top: 1px solid var(--border); color: var(--muted); text-align: center; padding: 1.25rem; font-size: 0.85rem; transition: 0.4s; margin-top: 4rem; }
    footer span { color: var(--accent); }

    @media (max-width: 850px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; justify-content: space-between; }
      nav { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">LA <span>MUERTE</span></a>
    <div class="header-right">
      <nav>
        <a href="index.html">Главная <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        <a href="family.html">Правила <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        <a href="transport.html">О транспорте <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        <a href="contracts.html">Контракты <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        <a href="tables.html">Таблицы <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        <a href="roulette.html" class="active">Рулетка <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
        
        <a href="#" onclick="goToProfile(event)" class="profile-btn">👤 Личный кабинет <span class="lightning left"></span><span class="lightning right"></span><span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span></a>
      </nav>

      <button class="theme-btn" id="themeToggle" title="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <section class="page-hero">
    <h1>Колесо Фортуны <em>La Muerte</em></h1>
    <p>Испытай удачу! Крути рулетку и получай призы.</p>
  </section>

  <section class="roulette-container">
    
    <!-- Само колесо -->
    <div class="wheel-wrapper" id="wheelWrapper">
      <div class="wheel-pointer">▼</div>
      <div class="wheel"></div>
      <div class="wheel-center" id="spinBtn">GO</div>
    </div>

    <!-- Результат -->
    <div class="prize-result" id="prizeResult"></div>
    
    <!-- Кнопка снизу -->
    <button class="spin-btn" id="spinBtnBottom">Крутить</button>

  </section>

  <footer>
    © 2024–2026 <span>La Muerte</span> — Все права защищены.
  </footer>

  <script>
    // ==========================================
    // НАСТРОЙКИ РУЛЕТКИ
    // ==========================================
    const PRIZES = [
      "100.000$", 
      "200.000$", 
      "500.000$", 
      "1.000.000$", 
      "Ничего :(", 
      "Редкий транспорт", 
      "Скидка 50%", 
      "500 MC"
    ];

    // ВАШ ВЕБХУК DISCORD (тот же, что в контрактах)
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1563583284930154668/9_Xj1LDUAup3DgDBky6Xui0gvshHaQQHD9sdHT0Ue0OCOmo1YaATZGCVF09iF-KP31aF';

    let currentRotation = 0;
    let isSpinning = false;

    // Функция для переключения темы
    (function () {
      const toggleBtn = document.getElementById('themeToggle');
      if (!toggleBtn) return;
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      toggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    })();

    // Переход в ЛК
    function goToProfile(e) {
      if (e) e.preventDefault();
      if (localStorage.getItem('lm_logged') === 'true') window.location.href = 'profile.html';
      else window.location.href = 'login.html';
    }

    // ==========================================
    // ЛОГИКА РУЛЕТКИ
    // ==========================================
    const wheelWrapper = document.getElementById('wheelWrapper');
    const spinBtnTop = document.getElementById('spinBtn');
    const spinBtnBottom = document.getElementById('spinBtnBottom');
    const prizeResult = document.getElementById('prizeResult');

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      
      // Блокируем кнопки
      spinBtnTop.classList.add('spinning');
      spinBtnBottom.disabled = true;
      prizeResult.classList.remove('show');
      prizeResult.textContent = '';

      // Выбираем случайный приз
      const randomIndex = Math.floor(Math.random() * PRIZES.length);
      const prize = PRIZES[randomIndex];

      // Вычисляем угол для остановки
      // Каждый сектор по 45 градусов (360 / 8)
      // Чтобы приз был под указателем (сверху), нужно крутить так, чтобы указатель смотрел на центр сектора.
      // Угол сектора = randomIndex * 45
      // Добавляем 4 полных оборота (4 * 360 = 1440) для эффекта
      // Добавляем случайное смещение внутри сектора, чтобы не всегда попадать ровно в центр
      const spinAngle = 1440 + (randomIndex * 45) + Math.floor(Math.random() * 30) - 15;
      
      // Обновляем общий угол (чтобы крутилось дальше, а не сбрасывалось)
      currentRotation += spinAngle;
      
      // Применяем вращение
      wheelWrapper.style.transform = `rotate(${currentRotation}deg)`;

      // Ждем окончания анимации (4 секунды)
      setTimeout(async () => {
        isSpinning = false;
        spinBtnTop.classList.remove('spinning');
        spinBtnBottom.disabled = false;
        
        // Показываем приз
        prizeResult.textContent = `Вы выиграли: ${prize}`;
        prizeResult.classList.add('show');

        // Отправляем в Discord
        await sendToDiscord(prize);

      }, 4000);
    }

    async function sendToDiscord(prize) {
      const nickname = prompt("Введите ваш никнейм в игре для записи выигрыша:", localStorage.getItem('nickname') || "");
      if (!nickname) return; // Если отменил, ничего не отправляем
      
      localStorage.setItem('nickname', nickname);

      const payload = {
        username: "La Muerte | Рулетка",
        avatar_url: "https://cdn-icons-png.flaticon.com/512/2621/2621040.png",
        embeds: [{
          title: "🎰 Новый выигрыш в рулетке!",
          color: 0xffd700,
          fields: [
            { name: "👤 Никнейм", value: nickname, inline: true },
            { name: "🎁 Приз", value: prize, inline: true },
            { name: "⏰ Время", value: new Date().toLocaleString('ru-RU'), inline: false }
          ],
          footer: { text: "Проверьте выигрыш и выдайте приз" }
        }]
      };

      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error('Ошибка отправки в Discord:', err);
      }
    }

    // Вешаем обработчики
    spinBtnTop.addEventListener('click', spinWheel);
    spinBtnBottom.addEventListener('click', spinWheel);

  </script>
</body>
</html>
