<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --panel: rgba(17, 17, 17, 0.95); --border: #222;
      --text: #eaeaea; --muted: #999; --accent: #c0392b; --gold: #d4af37; --green: #4caf50;
    }
    body {
      font-family: 'Overpass', sans-serif; background: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      background-color: #050505; color: var(--text); line-height: 1.6; min-height: 100vh; position: relative;
    }
    body::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

    header {
      background: rgba(5,5,5,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 10;
    }
    header .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: 3px; color: #fff; text-decoration: none; }
    header .logo span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.2s; }
    nav a:hover { color: #fff; }

    section.block { padding: 3rem 2rem; max-width: 1000px; margin: 0 auto; }
    .profile-grid { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }

    .profile-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 2rem; text-align: center; border-top: 3px solid var(--accent); height: fit-content;
    }
    
    .avatar-wrapper {
      position: relative; width: 150px; height: 150px; margin: 0 auto 1.5rem;
      border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 4rem; font-weight: 800; color: var(--accent); border: 3px solid var(--border);
      box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; display: none; }
    
    .profile-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.2rem; color: #fff; word-break: break-all; }
    .profile-status { font-size: 0.85rem; color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1.5rem; }
    
    .btn-outline {
      display: inline-block; padding: 0.6rem 1.2rem; background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 600;
      transition: all 0.2s; text-decoration: none; font-size: 0.9rem; width: 100%; margin-bottom: 0.5rem;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-admin { border-color: var(--accent) !important; color: var(--accent) !important; font-weight: 700 !important; }

    .stats-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    .stats-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: #fff; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
    .stat-item {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.3rem;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--gold); }
    .stat-value.money { color: var(--green); }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 0.8rem; background: #050505; border: 1px solid #333; color: #fff;
      border-radius: 6px; font-family: inherit; transition: border 0.2s; font-size: 0.95rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    
    .btn-save {
      padding: 0.8rem 1.5rem; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.2s; font-size: 0.95rem;
    }
    .btn-save:hover { background: #a93226; }

    @media (max-width: 768px) {
      .profile-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      nav a { margin-left: 0; margin-right: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">LA <span>MUERTE</span></a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="contracts.html">Контракты</a>
      <a href="tables.html">Таблицы</a>
      <a href="#" onclick="logout()" style="color: var(--accent); font-weight: 700;">Выйти</a>
    </nav>
  </header>

  <section class="block">
    <div class="profile-grid">
      
      <div class="profile-card">
        <div class="avatar-wrapper" id="avatarBox">?</div>
        <div class="profile-name" id="displayName">Загрузка...</div>
        <div class="profile-status" id="userRoleDisplay">Загрузка...</div>
        
        <a href="admin.html" id="adminPanelBtn" class="btn-outline btn-admin" style="display: none;">⚙️ Панель управления</a>
        
        <a href="#" class="btn-outline" onclick="resetProfile()" style="border-color: #333;">Сбросить профиль</a>
      </div>

      <div class="stats-card">
        <div class="stats-title">📊 Статистика персонажа</div>
        <div class="stats-grid">
          <div class="stat-item"><span class="stat-label">Уровень</span><span class="stat-value" id="statLevel">1</span></div>
          <div class="stat-item"><span class="stat-label">Баланс ($)</span><span class="stat-value money" id="statMoney">0</span></div>
          <div class="stat-item"><span class="stat-label">Контракты</span><span class="stat-value" id="statContracts">0</span></div>
          <div class="stat-item"><span class="stat-label">Часов в игре</span><span class="stat-value" id="statHours">0</span></div>
        </div>

        <div class="stats-title">⚙️ Настройки профиля</div>
        <div class="form-group">
          <label>Ваш Никнейм</label>
          <input type="text" id="inputName" readonly style="opacity: 0.7;">
        </div>
        <div class="form-group">
          <label>Ссылка на аватар (URL)</label>
          <input type="text" id="inputAvatar" placeholder="https://example.com/avatar.png">
        </div>
        <button class="btn-save" onclick="saveProfile()">Сохранить изменения</button>
      </div>

    </div>
  </section>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userData = null;

    async function initProfile() {
      console.log("Начинаем загрузку профиля...");
      
      // 1. Получаем сессию
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      
      if (sessionError) {
        console.error("Ошибка сессии:", sessionError);
        alert("Ошибка авторизации: " + sessionError.message);
        return;
      }

      if (!session) {
        console.log("Нет сессии, кидаем на вход");
        window.location.href = 'login.html';
        return;
      }

      currentUser = session.user;
      console.log("Пользователь авторизован:", currentUser.id, currentUser.email);

      // 2. Запрашиваем профиль
      console.log("Запрашиваем данные из таблицы profiles для ID:", currentUser.id);
      
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle(); // maybeSingle не выдает ошибку, если ничего не найдено

      if (error) {
        console.error("Ошибка при чтении из базы:", error);
        alert("Ошибка базы данных: " + error.message + "\n(Проверь RLS в Supabase)");
        document.getElementById('displayName').textContent = 'Ошибка БД';
        return;
      }

      if (!data) {
        console.warn("Запись в базе не найдена! Создаем вручную...");
        // Если триггер не сработал, создаем запись вручную прямо сейчас
        const { error: insertError } = await supabase
          .from('profiles')
          .insert([{ id: currentUser.id, nickname: currentUser.email.split('@')[0], role: 'Боец' }]);
          
        if (insertError) {
           console.error("Не удалось создать запись:", insertError);
           alert("Не удалось создать профиль. Ошибка: " + insertError.message);
           return;
        } else {
           location.reload(); // Перезагружаем, чтобы данные подтянулись
           return;
        }
      }

      console.log("Данные профиля успешно загружены:", data);
      userData = data;
      
      // 3. Заполняем интерфейс
      document.getElementById('displayName').textContent = userData.nickname;
      document.getElementById('inputName').value = userData.nickname;
      document.getElementById('avatarBox').textContent = userData.nickname.charAt(0).toUpperCase();
      document.getElementById('userRoleDisplay').textContent = userData.role;

      if (userData.role === 'Администратор') {
        document.getElementById('adminPanelBtn').style.display = 'block';
      }

      const savedAvatar = userData.avatar;
      if (savedAvatar) {
        const img = document.createElement('img');
        img.src = savedAvatar;
        img.onload = () => {
          document.getElementById('avatarBox').textContent = '';
          document.getElementById('avatarBox').appendChild(img);
          img.style.display = 'block';
        };
        document.getElementById('inputAvatar').value = savedAvatar;
      }
    }

    // Запускаем через секунду, чтобы Supabase точно восстановил сессию
    setTimeout(initProfile, 500);

    window.logout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };

    window.saveProfile = async function() {
      const newAvatar = document.getElementById('inputAvatar').value.trim();
      
      const { error } = await supabase
        .from('profiles')
        .update({ avatar: newAvatar })
        .eq('id', currentUser.id);

      if (error) {
        alert('Ошибка сохранения: ' + error.message);
      } else {
        alert('Профиль обновлён!');
        location.reload();
      }
    };

    window.resetProfile = function() {
      if(confirm('Вы уверены? Вы выйдете из аккаунта.')) {
        window.logout();
      }
    };
  </script>
</body>
</html>
