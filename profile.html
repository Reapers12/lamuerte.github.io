<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --panel: rgba(17, 17, 17, 0.95); --border: #222;
      --text: #eaeaea; --muted: #999; --accent: #c0392b; --gold: #d4af37; --green: #4caf50;
    }
    body {
      font-family: 'Overpass', sans-serif; background: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      background-color: #050505; color: var(--text); line-height: 1.6; min-height: 100vh; position: relative;
    }
    body::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

    /* Шапка */
    header {
      background: rgba(5,5,5,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    }
    header .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: 3px; color: #fff; text-decoration: none; }
    header .logo span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.2s; }
    nav a:hover { color: #fff; }

    /* Контент */
    section.block { padding: 3rem 2rem; max-width: 1000px; margin: 0 auto; }
    
    .profile-grid {
      display: grid; grid-template-columns: 280px 1fr; gap: 2rem;
    }

    /* Левая панель (Аватар) */
    .profile-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 2rem; text-align: center; border-top: 3px solid var(--accent);
    }
    .avatar-wrapper {
      position: relative; width: 140px; height: 140px; margin: 0 auto 1.5rem;
      border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; font-weight: 800; color: var(--accent); border: 3px solid var(--border);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; }
    
    .profile-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.2rem; color: #fff; }
    .profile-status { font-size: 0.85rem; color: var(--green); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1.5rem; }
    
    .btn-outline {
      display: inline-block; padding: 0.6rem 1.2rem; background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 600;
      transition: all 0.2s; text-decoration: none; font-size: 0.9rem;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Правая панель (Статистика) */
    .stats-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2rem;
    }
    .stats-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
    .stat-item {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.3rem;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .stat-value.money { color: var(--green); }

    /* Настройки */
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%; padding: 0.7rem; background: #050505; border: 1px solid #333; color: #fff;
      border-radius: 6px; font-family: inherit; transition: border 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    
    .btn-save {
      padding: 0.7rem 1.5rem; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: #a93226; }

    @media (max-width: 768px) {
      .profile-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">LA <span>MUERTE</span></a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="tables.html">Таблицы</a>
      <a href="contracts.html">Контракты</a>
      <a href="#" onclick="logout()" style="color: var(--accent);">Выйти</a>
    </nav>
  </header>

  <section class="block">
    <div class="profile-grid">
      
      <!-- Левая колонка -->
      <div class="profile-card">
        <div class="avatar-wrapper" id="avatarBox">?</div>
        <div class="profile-name" id="displayName">Загрузка...</div>
        <div class="profile-status">Участник семьи</div>
        <a href="#" class="btn-outline" onclick="resetProfile()">Сбросить профиль</a>
      </div>

      <!-- Правая колонка -->
      <div class="stats-card">
        <div class="stats-title">📊 Статистика персонажа</div>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Уровень</span>
            <span class="stat-value" id="statLevel">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Баланс ($)</span>
            <span class="stat-value money" id="statMoney">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Выполнено контрактов</span>
            <span class="stat-value" id="statContracts">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Часов в игре</span>
            <span class="stat-value" id="statHours">0</span>
          </div>
        </div>

        <div class="stats-title">⚙️ Настройки профиля</div>
        <div class="form-group">
          <label>Ваш Никнейм</label>
          <input type="text" id="inputName" placeholder="Введите ник">
        </div>
        <div class="form-group">
          <label>Ссылка на аватар (URL)</label>
          <input type="text" id="inputAvatar" placeholder="https://...">
        </div>
        <button class="btn-save" onclick="saveProfile()">Сохранить изменения</button>
      </div>

    </div>
  </section>

  <script>
    // 1. Защита страницы (если не залогинен — на вход)
    if (localStorage.getItem('lm_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    // 2. Загрузка данных
    const user = localStorage.getItem('lm_user') || 'Неизвестный';
    document.getElementById('displayName').textContent = user;
    document.getElementById('avatarBox').textContent = user.charAt(0).toUpperCase();
    
    // Загружаем доп. настройки, если есть
    const savedAvatar = localStorage.getItem('lm_avatar');
    if (savedAvatar) {
      const img = document.createElement('img');
      img.src = savedAvatar;
      img.onload = () => {
        document.getElementById('avatarBox').textContent = '';
        document.getElementById('avatarBox').appendChild(img);
        img.style.display = 'block';
      };
      document.getElementById('inputAvatar').value = savedAvatar;
    }

    document.getElementById('inputName').value = user;

    // 3. Сохранение
    function saveProfile() {
      const newName = document.getElementById('inputName').value.trim();
      const newAvatar = document.getElementById('inputAvatar').value.trim();

      if (!newName) return alert('Никнейм не может быть пустым!');

      localStorage.setItem('lm_user', newName);
      localStorage.setItem('lm_avatar', newAvatar);

      document.getElementById('displayName').textContent = newName;
      
      const box = document.getElementById('avatarBox');
      box.innerHTML = '';
      if (newAvatar) {
        const img = document.createElement('img');
        img.src = newAvatar;
        img.style.display = 'block';
        box.appendChild(img);
      } else {
        box.textContent = newName.charAt(0).toUpperCase();
      }
      alert('Профиль обновлён!');
    }

    // 4. Выход
    function logout() {
      localStorage.removeItem('lm_logged');
      window.location.href = 'login.html';
    }

    // 5. Сброс
    function resetProfile() {
      if(confirm('Удалить все данные профиля?')) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
