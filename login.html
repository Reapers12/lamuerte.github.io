<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход / Регистрация — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { 
      --bg: #0a0a0a; --panel: rgba(17,17,17,0.95); --border: #222; 
      --text: #eaeaea; --muted: #999; --accent: #c0392b; --green: #4caf50; --gold: #d4af37;
    }
    body {
      font-family: 'Overpass', sans-serif; background: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      background-color: #050505; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    body::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }
    
    .auth-box {
      background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-box h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; font-weight: 800; }
    .auth-box h1 span { color: var(--accent); }

    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tabs button {
      flex: 1; padding: 0.8rem; background: transparent; border: none; color: var(--muted);
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: #fff; border-bottom-color: var(--accent); }
    
    .auth-view { display: none; }
    .auth-view.active { display: block; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 0.8rem; background: #050505; border: 1px solid #333; color: #fff;
      border-radius: 6px; font-family: inherit; transition: border 0.2s; font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(192,57,43,0.3); }

    .btn {
      width: 100%; padding: 0.9rem; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1rem; letter-spacing: 1px;
    }
    .btn:hover { background: #a93226; transform: translateY(-2px); }
    
    .msg { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--green); display: none; font-weight: 600; }
    .msg.error { color: var(--accent); }
    
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #666; text-decoration: none; font-size: 0.85rem; transition: 0.2s; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="auth-box">
    <h1>LA <span>MUERTE</span></h1>
    
    <div class="tabs">
      <button class="active" onclick="switchTab('login')" id="tabLogin">Вход</button>
      <button onclick="switchTab('register')" id="tabRegister">Регистрация</button>
    </div>

    <!-- ФОРМА ВХОДА -->
    <div class="auth-view active" id="loginForm">
      <div class="form-group">
        <label>Email (почта)</label>
        <!-- Здесь строго Email -->
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="••••••••">
      </div>
      <button class="btn" onclick="doLogin()">Войти</button>
    </div>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div class="auth-view" id="registerForm">
      <div class="form-group">
        <label>Ваш Никнейм (для игры)</label>
        <input type="text" id="regNickname" placeholder="Например: Kai Muerte">
      </div>
      <div class="form-group">
        <label>Email (почта)</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль (мин. 6 символов)</label>
        <input type="password" id="regPass" placeholder="••••••••">
      </div>
      <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
    </div>

    <div class="msg" id="authMsg"></div>
    <a href="index.html" class="back-link">← Вернуться на главную</a>
  </div>

  <!-- Скрипт Supabase -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://drumwcypxzwmwmtozrhd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LUAvDl9YpoCe6ordyuPttQ_tVLal6QY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchTab(tab) {
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('registerForm').classList.remove('active');
      
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
      hideMsg();
    }

    function showMsg(text, isError = false) {
      const msg = document.getElementById('authMsg');
      msg.textContent = text;
      msg.className = isError ? 'msg error' : 'msg';
      msg.style.display = 'block';
    }

    function hideMsg() { document.getElementById('authMsg').style.display = 'none'; }

    // РЕГИСТРАЦИЯ
    window.doRegister = async function() {
      const nickname = document.getElementById('regNickname').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value;

      if (!nickname || !email || !pass) return showMsg('Заполните все поля!', true);
      if (pass.length < 6) return showMsg('Пароль должен быть от 6 символов!', true);

      try {
        // Создаем пользователя (по Email и паролю)
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: email,
          password: pass,
        });

        if (authError) throw authError;

        // Сохраняем никнейм и роль в базу
        const { error: dbError } = await supabase
          .from('profiles')
          .insert([
            { id: authData.user.id, nickname: nickname, role: 'Боец' }
          ]);

        if (dbError) throw dbError;

        showMsg('Успешная регистрация! Переход...');
        setTimeout(() => { window.location.href = 'profile.html'; }, 1000);
      } catch (error) {
        console.error(error);
        showMsg('Ошибка: ' + error.message, true);
      }
    };

    // ВХОД
    window.doLogin = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!email || !pass) return showMsg('Заполните все поля!', true);

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: email,
          password: pass,
        });

        if (error) throw error;

        showMsg('Успешный вход! Переход...');
        setTimeout(() => { window.location.href = 'profile.html'; }, 1000);
      } catch (error) {
        console.error(error);
        showMsg('Неверный email или пароль!', true);
      }
    };

    window.switchTab = switchTab;
  </script>
</body>
</html>
