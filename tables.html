<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблицы — La Muerte</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --panel: rgba(17, 17, 17, 0.95);
      --border: #222;
      --text: #eaeaea;
      --muted: #999;
      --accent: #c0392b;
      --gold: #d4af37;
    }

    body {
      font-family: 'Overpass', sans-serif;
      background: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      background-color: #050505;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: -1;
      pointer-events: none;
    }

    header {
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header .logo {
      font-family: 'Overpass', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 3px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
      display: inline-block;
    }
    header .logo:hover { opacity: 0.75; }
    header .logo span { color: var(--accent); }

    nav a {
      color: var(--muted);
      margin-left: 1.5rem;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
      cursor: pointer;
      white-space: nowrap;
    }
    nav a:hover { color: #fff; }
    nav a.active { color: #fff; }

    .page-hero {
      padding: 5rem 2rem 2rem;
      text-align: center;
      position: relative;
    }
    .page-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(192, 57, 43, 0.3), transparent 60%);
      pointer-events: none;
    }
    .page-hero h1 {
      font-family: 'Overpass', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 1rem;
      position: relative;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
    }
    .page-hero h1 em {
      color: var(--accent);
      font-style: normal;
    }
    .page-hero p {
      color: #ccc;
      font-size: 1.05rem;
      max-width: 640px;
      margin: 0 auto;
      position: relative;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }

    section.block {
      padding: 2rem 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .table-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      max-width: 620px;
      margin: 0 auto;
    }

    /* ========== КАРТОЧКА — УМЕНЬШЕНА ========== */
    .table-card {
      background: var(--panel);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 0.85rem 1.15rem;   /* было 1.5rem 1.75rem */
      display: flex;
      align-items: center;
      gap: 0.85rem;               /* было 1rem */
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .table-card:hover {
      transform: translateX(8px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(192, 57, 43, 0.25);
    }

    .table-card .card-icon {
      font-size: 1.75rem;         /* было 2.25rem */
      flex-shrink: 0;
    }

    .table-card .card-content {
      flex: 1;
    }

    .table-card .card-title {
      font-family: 'Overpass', sans-serif;
      font-weight: 700;
      font-size: 1rem;            /* было 1.15rem */
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 0.15rem;     /* было 0.25rem */
    }

    .table-card .card-desc {
      font-size: 0.8rem;          /* было 0.9rem */
      color: var(--muted);
    }

    .table-card .card-arrow {
      font-size: 1.1rem;          /* было 1.25rem */
      color: var(--accent);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .table-card:hover .card-arrow {
      transform: translateX(4px);
    }

    .back-block {
      text-align: center;
      padding: 2rem 2rem 4rem;
    }
    .btn-back {
      display: inline-block;
      padding: 0.8rem 1.75rem;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }
    .btn-back:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    footer {
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--border);
      color: #666;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
    }
    footer span { color: var(--accent); }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      nav a { margin-left: 0; margin-right: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">LA <span>MUERTE</span></a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="family.html">О семье</a>
      <a href="transport.html">О транспорте</a>
      <a href="contracts.html">Контракты</a>
      <a href="index.html">Вступить в семью</a>
      <a href="tables.html" class="active">Таблицы</a>
    </nav>
  </header>

  <section class="page-hero">
    <h1>Таблицы <em>La Muerte</em></h1>
    <p>Все таблицы семьи: прокачка, статистика и гайды.</p>
  </section>

  <section class="block">
    <div class="table-cards">

      <a href="house.html" class="table-card">
        <span class="card-icon">🏠</span>
        <div class="card-content">
          <div class="card-title">Прокачка Кухни и Шкафа</div>
          <div class="card-desc">Уровни кухни и шкафа в доме или квартире</div>
        </div>
        <span class="card-arrow">→</span>
      </a>

    </div>
  </section>

  <div class="back-block">
    <a href="index.html" class="btn-back">← Вернуться на главную</a>
  </div>

  <footer>
    © 2024–2026 <span>La Muerte</span> — Все права защищены.
  </footer>
</body>
</html>
